<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="details">
    <h1>Details</h1>

    <div class="details-content">
        <!-- Client Details -->
        <div th:if="${type == 'client'}" class="client-details">
            <h2>Client Details</h2>
            <div class="info-group" th:each="field : ${data.displayFields}">
                <label th:text="${field.key}"></label>
                <span th:text="${field.value}"></span>
            </div>

            <div th:if="${data.client.invoices}" class="related-data">
                <h3>Related Invoices</h3>
                <div class="data-grid">
                    <div th:each="invoice : ${data.client.invoices}" class="data-card">
                        <p>Invoice ID: <span th:text="${invoice.id}"></span></p>
                        <p>Status:
                            <span th:text="${invoice.status == 'paid' ? 'Payé' : 'Pas encore payé'}"></span>
                        </p>
                        <p>Due Date: <span th:text="${invoice.due_at}"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Project Details -->
        <div th:if="${type == 'project'}" class="project-details">
            <h2 th:text="${data.project.title}"></h2>
            <p th:utext="${data.project.description}"></p>

<!--
            <div class="info-group">
                <label>External ID:</label>
                <span th:text="${data.project.externalId}"></span>
            </div>
-->

            <div class="info-group">
                <label>Status:</label>
                <span th:text="${data.project.status.title}"></span>
            </div>

            <div class="info-group">
                <label>Assigned to:</label>
                <span th:text="${data.project.assignee != null ? data.project.assignee.name : 'Unassigned'}"></span>
            </div>

            <div class="info-group">
                <label>Created by:</label>
                <span th:text="${data.project.creator.name}"></span>
            </div>

            <div class="info-group">
                <label>Client:</label>
                <span th:text="${data.project.client.company_name != null ? data.project.client.company_name : 'No client'}"></span>
            </div>

            <div class="info-group">
                <label>Deadline:</label>
                <span th:text="${data.project.deadline}"></span>
            </div>

            <div th:if="${data.project.tasks}" class="related-data">
                <h3>Tasks</h3>
                <div class="data-grid">
                    <div th:each="task : ${data.project.tasks}" class="data-card">
                        <p>Task: <span th:text="${task.name}"></span></p>
                        <p>Status:
                            <span th:text="${task.completed ? 'Completed' : 'Pending'}"></span>
                        </p>
                        <p>Due Date: <span th:text="${task.due_date}"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Task Details -->
        <div th:if="${type == 'task'}" class="task-details">
            <h2 th:text="${data.task.title}"></h2>
            <p th:utext="${data.task.description}"></p>

<!--
            <div class="info-group">
                <label>External ID:</label>
                <span th:text="${data.task.externalId}"></span>
            </div>
-->

            <div class="info-group">
                <label>Status:</label>
                <span th:text="${data.task.status.title}"></span>
            </div>

            <div class="info-group">
                <label>Project:</label>
                <span th:text="${data.task.project != null ? data.task.project.title : 'No project'}"></span>
            </div>

            <div class="info-group">
                <label>Assigned to:</label>
                <span th:text="${data.task.assignee != null ? data.task.assignee.name : 'Unassigned'}"></span>
            </div>

            <div class="info-group">
                <label>Created by:</label>
                <span th:text="${data.task.creator.name}"></span>
            </div>

            <div class="info-group">
                <label>Client:</label>
                <span th:text="${data.task.client != null ? data.task.client.name : 'No client'}"></span>
            </div>

            <div class="info-group">
                <label>Deadline:</label>
                <span th:text="${data.task.deadline}"></span>
            </div>

            <div th:if="${data.task.invoice}" class="related-data">
                <h3>Linked Invoice</h3>
                <div class="data-grid">
                    <div class="data-card">
                        <p>Invoice ID: <span th:text="${data.task.invoice.id}"></span></p>
                        <p>Status: <span th:text="${data.task.invoice.status}"></span></p>
                        <p>Due Date: <span th:text="${data.task.invoice.due_at}"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Offer Details -->
        <div th:if="${type == 'offers'}" class="offer-details">
            <h2 th:text="'Offer ' + ${data.offers.id}"></h2>

<!--
            <div class="info-group">
                <label>External ID:</label>
                <span th:text="${data.offers.externalId}"></span>
            </div>
-->

            <div class="info-group">
                <label>Status:</label>
                <span th:text="${data.offers.status != null and data.offers.status == 'won' ? 'Gagné' : 'En cours'}"></span>
            </div>

            <div class="info-group">
                <label>Sent At:</label>
                <span th:text="${data.offers.created_at}"></span>
            </div>

            <div class="info-group">
                <label>Due At:</label>
                <span th:text="${data.offers.due_at}"></span>
            </div>

<!--
            <div class="info-group">
                <label>Source ID:</label>
                <span th:text="${data.offers.source_id}"></span>
            </div>

            <div class="info-group">
                <label>Source Type:</label>
                <span th:text="${data.offers.source_type}"></span>
            </div>
-->

            <div th:if="${data.offers.invoice}" class="related-data">
                <h3>Linked Invoice</h3>
                <div class="data-grid">
                    <div class="data-card">
                        <p>Invoice ID: <span th:text="${data.offers.invoice.id}"></span></p>
                        <p>Status: <span th:text="${data.offers.invoice.status != null and data.offers.invoice.status == 'paid' ? 'Payé' : 'Non payé'}"></span></p>
                        <p>Due Date: <span th:text="${data.offers.invoice.due_at}"></span></p>
                    </div>
                </div>
            </div>

            <div th:if="${data.offers.invoiceLines}" class="related-data">
                <h3>Invoice Lines</h3>
                <div class="data-grid">
                    <div th:each="line : ${data.offers.invoiceLines}" class="data-card">
                        <p>Description: <span th:text="${line.description}"></span></p>
                        <p>Amount: <span th:text="${line.amount}"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Payment Details -->
        <div th:if="${type == 'payment'}" class="payment-details">
            <h2>Payment Details</h2>
            <div class="info-group">
                <label>Client:</label>
                <span th:text="${data.clientName}"></span>
            </div>
            <div class="info-group">
                <label>Amount:</label>
                <span th:text="${data.payment.amount}"></span>
            </div>
            <div class="info-group">
                <label>Date:</label>
                <span th:text="${data.payment.payment_date}"></span>
            </div>
            <div class="info-group">
                <label>Description:</label>
                <span th:text="${data.payment.description}"></span>
            </div>

            <div class="actions" th:if="${data.canModify}">
                <form th:action="@{/dashboard/payment/{id}(id=${data.payment.id})}" method="post">
                    <label>New Amount:
                        <input type="number" step="0.01" name="amount" th:value="${data.payment.amount}" required/>
                    </label>
                    <button type="submit" class="btn btn-primary">Update Amount</button>
                </form>

                <form th:action="@{/dashboard/payment/{id}(id=${data.payment.id})}"
                      th:method="delete"
                      onsubmit="return confirm('Are you sure you want to delete this payment?')">
                    <button type="submit" class="btn btn-danger">Delete Payment</button>
                </form>
            </div>
        </div>

        <!-- Invoice Details -->
        <div th:if="${type == 'invoice'}" class="invoice-details">
            <h2>Invoice Details</h2>
            <div class="info-group">
                <label>Status:</label>
                <span th:text="${data.invoice.status != null and data.invoice.status == 'paid' ? 'Payé' : 'Non payé'}"></span>
            </div>
            <div class="info-group">
                <label>Due Date:</label>
                <span th:text="${data.invoice.due_at}"></span>
            </div>
            <div class="info-group">
                <label>Original Amount:</label>
                <span th:text="${#aggregates.sum(data.invoice.invoiceLines.![amount])}"></span>
            </div>
            <div class="info-group">
                <label>Discounted Amount:</label>
                <span th:text="${data.discountedAmount}"></span>
            </div>
        </div>
    </div>

    <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
</div>
</body>
</html>
